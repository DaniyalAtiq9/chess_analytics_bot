name: Refresh chess.com stats

on:
  schedule:
    # Daily at 06:17 UTC. Off the top of the hour on purpose — GitHub queues
    # scheduled runs and top-of-hour slots are the most congested, so exact
    # timing on the hour can get delayed by 20-30+ minutes.
    - cron: "17 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # required to commit updated data/charts back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stats refresh
        env:
          CHESS_USERNAME: ${{ vars.CHESS_USERNAME }}
          CHESS_CONTACT_EMAIL: ${{ vars.CHESS_CONTACT_EMAIL }}
        run: python main.py

      - name: Commit updated data and charts
        run: |
          git config user.name "chess-stats-bot"
          git config user.email "actions@github.com"
          git add data/ charts/ README.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-refresh chess stats $(date -u +'%Y-%m-%d')"
          git push
